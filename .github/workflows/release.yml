# GitHub Release from the cached FE and BE builds of the current patch series (manual dispatch only).
# Builds nothing: run fe / be first. Takes the outputs from the fe-out / be-out caches, falling back to the
# newest fe-jars-<hash> / starrocks_be-<hash> workflow artifact. FE and BE must report the same series hash
# (4.1.4-<commit_hash>); after an FE-only patch change that needs 'be force=true' (ccache-only rebuild).
# A draft release creates no git tag until published; re-running with the tag of an existing draft replaces
# that draft, a published release is never touched.
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, e.g. v4.1.4-flight.1"
        required: true
      draft:
        description: "create as draft (dry run; publish by hand after M4)"
        type: boolean
        default: true
      prerelease:
        description: "mark as pre-release"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "::error::bad tag '$TAG'"; exit 1; }
          if draft=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            [ "$draft" = true ] || { echo "::error::release $TAG is already published"; exit 1; }
          fi
      - name: Prepare source
        run: scripts/prepare-source.sh "$RUNNER_TEMP/src"
      - name: Input hashes
        id: hash
        run: |
          . ci/env.sh
          echo "fe=$(scripts/input-hash.sh "$RUNNER_TEMP/src" fe)" >> "$GITHUB_OUTPUT"
          echo "be=$(scripts/input-hash.sh "$RUNNER_TEMP/src" be)" >> "$GITHUB_OUTPUT"
          echo "commit_hash=$STARROCKS_BASE_HASH-fl$(cat patches/*.patch | sha256sum | cut -c1-6)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Restore FE output
        id: fe
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/sr-fe-out
          key: fe-out-${{ steps.hash.outputs.fe }}
      - name: Restore BE output
        id: be
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/sr-out
          key: be-out-${{ steps.hash.outputs.be }}
      - name: Fall back to workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CH: ${{ steps.hash.outputs.commit_hash }}
        run: |
          # A cache entry can be missing (evicted) or stale (an older build of the same sources reports another
          # series hash); then take the newest workflow artifact of that input hash.
          fetch() { # build-info file, artifact name, target dir
            if [ -s "$3/$1" ] && grep -qx "commit_hash=$CH" "$3/$1"; then echo "$2: cached output is current"; return; fi
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$2&per_page=100" \
                   --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')
            [ -n "$id" ] || { echo "::error::no current output and no artifact $2: run the build first"; exit 1; }
            echo "$2: using artifact $id"
            rm -rf "$3" && mkdir -p "$3"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/a.zip"
            unzip -o -q "$RUNNER_TEMP/a.zip" -d "$3"
          }
          fetch fe-build-info.txt "fe-jars-${{ steps.hash.outputs.fe }}" /home/runner/sr-fe-out
          fetch be-build-info.txt "starrocks_be-${{ steps.hash.outputs.be }}" /home/runner/sr-out
      - name: Assemble assets
        run: ci/release.sh /home/runner/sr-fe-out /home/runner/sr-out "${{ steps.hash.outputs.commit_hash }}" "${{ inputs.tag }}" "$RUNNER_TEMP/dist"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd "$RUNNER_TEMP/dist"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes
          fi
          flags=()
          [ "${{ inputs.draft }}" = true ] && flags+=(--draft)
          [ "${{ inputs.prerelease }}" = true ] && flags+=(--prerelease)
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${flags[@]}" \
            --title "StarRocks 4.1.4 + Arrow Flight SQL catalog ($TAG)" --notes-file release-notes.md \
            $(ls | grep -v '^release-notes.md$')
          gh release view "$TAG" -R "$GITHUB_REPOSITORY"
