# Connector comparison (docs/CONNECTOR-COMPARE.md): TPC-H q01-q22 through up to three StarRocks paths to the same
# Flight server, one after the other on one runner: ours (4.1.4 + this series), up (the upstream native fork on
# 4.0, outputs of up-fe / up-be) and jdbc (stock 4.0.17 + the upstream JDBC adapter driver from up-fe).
# Manual only: `compare sf=1 paths=ours,up,jdbc profiles=default,speed` in ci/dispatch.txt.
# Results: artifact compare-<run> and branch m4-results (compare/<run>.md).
name: compare
on:
  workflow_dispatch:
    inputs:
      sf:
        description: "TPC-H scale factor: 1 (the m4 data) or 10 (generated by DuckDB dbgen in the job)"
        default: "1"
      paths:
        description: "comma-separated: ours, up, jdbc"
        default: "ours,up,jdbc"
      profiles:
        description: "comma-separated server profiles: default (no tuning flags), speed (-DresourceProfile=speed)"
        default: "default"
      server:
        description: "Flight server jar asset of release m4-assets"
        default: "arrow-flight-server-1.0.0-deafc861cce3-linux.jar"
      runs:
        description: "runs per query (1st = cold)"
        default: "3"
      timeout:
        description: "StarRocks query_timeout (s) per query"
        default: "900"

concurrency:
  group: m4
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      M4_SERVER_JAR: ${{ inputs.server }}
    steps:
      - uses: actions/checkout@v4
      - name: Check inputs
        run: |
          [[ "$M4_SERVER_JAR" =~ ^arrow-flight-server-[A-Za-z0-9.-]+\.jar$ ]] || { echo "::error::bad server jar name"; exit 1; }
          case "${{ inputs.sf }}" in 1|10) ;; *) echo "::error::sf must be 1 or 10"; exit 1 ;; esac
          echo "${{ inputs.paths }}" | grep -qxE '(ours|up|jdbc)(,(ours|up|jdbc))*' || { echo "::error::bad paths"; exit 1; }
          echo "${{ inputs.profiles }}" | grep -qxE '(default|speed)(,(default|speed))*' || { echo "::error::bad profiles"; exit 1; }
          [[ "${{ inputs.runs }}${{ inputs.timeout }}" =~ ^[0-9]+$ ]] || { echo "::error::runs/timeout must be numbers"; exit 1; }
      - name: Runner setup
        run: ci/runner-setup.sh light
      - name: Prepare source (ours)
        run: scripts/prepare-source.sh "$RUNNER_TEMP/src"
      - name: Input hashes
        id: hash
        run: |
          . ci/env.sh
          echo "fe=$(scripts/input-hash.sh "$RUNNER_TEMP/src" fe)" >> "$GITHUB_OUTPUT"
          echo "be=$(scripts/input-hash.sh "$RUNNER_TEMP/src" be)" >> "$GITHUB_OUTPUT"
          echo "commit_hash=$STARROCKS_BASE_HASH-fl$(cat patches/*.patch | sha256sum | cut -c1-6)" >> "$GITHUB_OUTPUT"
          echo "up_fe=$(cat ci/up/env.sh ci/build-fe.sh .github/workflows/up-fe.yml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "up_be=$(cat ci/up/env.sh ci/build-be.sh ci/ccache-g0.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
          rm -rf "$RUNNER_TEMP/src"
      - name: Restore FE output (ours)
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/sr-fe-out
          key: fe-out-${{ steps.hash.outputs.fe }}
      - name: Restore BE output (ours)
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/sr-out
          key: be-out-${{ steps.hash.outputs.be }}
      - name: Restore FE output (up)
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/up-fe-out
          key: up-fe-out-${{ steps.hash.outputs.up_fe }}
      - name: Restore BE output (up)
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/up-be-out
          key: up-be-out-${{ steps.hash.outputs.up_be }}
      - name: Fall back to workflow artifacts
        env:
          CH: ${{ steps.hash.outputs.commit_hash }}
        run: |
          fetch() { # file that must exist, artifact name, target dir
            if [ -s "$3/$1" ]; then echo "$2: cached output"; return 0; fi
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$2&per_page=100" \
                   --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')
            [ -n "$id" ] || { echo "$2: no cached output and no artifact"; return 1; }
            echo "$2: using artifact $id"
            rm -rf "$3" && mkdir -p "$3"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/a.zip"
            unzip -o -q "$RUNNER_TEMP/a.zip" -d "$3"; rm -f "$RUNNER_TEMP/a.zip"
          }
          avail=""
          for p in $(echo "${{ inputs.paths }}" | tr , ' '); do
            case $p in
            ours) fetch fe-build-info.txt "fe-jars-${{ steps.hash.outputs.fe }}" /home/runner/sr-fe-out &&
                  fetch be-build-info.txt "starrocks_be-${{ steps.hash.outputs.be }}" /home/runner/sr-out &&
                  grep -qx "commit_hash=$CH" /home/runner/sr-fe-out/fe-build-info.txt &&
                  grep -qx "commit_hash=$CH" /home/runner/sr-out/be-build-info.txt && avail="$avail ours" ;;
            up)   fetch up-fe-build-info.txt "up-fe-${{ steps.hash.outputs.up_fe }}" /home/runner/up-fe-out &&
                  fetch be-build-info.txt "up-starrocks_be-${{ steps.hash.outputs.up_be }}" /home/runner/up-be-out &&
                  avail="$avail up" ;;
            jdbc) fetch up-fe-build-info.txt "up-fe-${{ steps.hash.outputs.up_fe }}" /home/runner/up-fe-out &&
                  avail="$avail jdbc" ;;
            esac || echo "::warning::path $p skipped: its build outputs are missing"
          done
          echo "CMP_PATHS=$avail" >> "$GITHUB_ENV"
          echo "paths with outputs:$avail"
          [ -n "$avail" ] || { echo "::error::no path has its build outputs"; exit 1; }
      - name: Download m4 assets
        run: ci/m4/stack.sh assets "$WORK/m4-assets"
      # duckdb 1.4.1 has no wheel for the runner's default Python (pip built it from source: 18 min in run 41447501206)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python
        run: |
          pip install --quiet duckdb==1.4.1 pymysql boto3
          echo "127.0.0.1 flight1 minio" | sudo tee -a /etc/hosts
      - name: TPC-H data
        run: |
          if [ "${{ inputs.sf }}" = 1 ]; then echo "CMP_TPCH=$WORK/m4-assets/x/sf1/tpch" >> "$GITHUB_ENV"; exit 0; fi
          out=$WORK/sf${{ inputs.sf }}/tpch; mkdir -p "$out"
          python3 - "$out" "$WORK/dbgen.duckdb" <<'PY'
          import duckdb, os, sys, time
          out, db = sys.argv[1], sys.argv[2]
          t0 = time.time()
          d = duckdb.connect(db)
          d.execute("SET memory_limit = '10GB'"); d.execute(f"SET temp_directory = '{db}.tmp'")
          d.execute("INSTALL tpch"); d.execute("LOAD tpch"); d.execute("CALL dbgen(sf = ${{ inputs.sf }})")
          for (t,) in d.execute("SHOW TABLES").fetchall():
              d.execute(f"COPY {t} TO '{out}/{t}' (FORMAT parquet, FILE_SIZE_BYTES '256MB')")
              print(t, d.execute(f"SELECT count(*) FROM {t}").fetchone()[0], sorted(os.listdir(f"{out}/{t}")), flush=True)
          print(f"dbgen + parquet {time.time() - t0:.0f}s")
          PY
          rm -rf "$WORK/dbgen.duckdb" "$WORK/dbgen.duckdb.tmp"; du -sh "$out"; df -h / "$WORK"
          echo "CMP_TPCH=$out" >> "$GITHUB_ENV"
      - name: Reference answers (DuckDB)
        run: python3 ci/m4/compare.py reference --tpch "$CMP_TPCH" --out "$RUNNER_TEMP/ref.json"
      - name: MinIO + data
        run: M4_TPCH_DIR="$CMP_TPCH" ci/m4/stack.sh minio "$WORK/m4-assets"
      - name: Compare
        run: |
          out=$RUNNER_TEMP/cmp; mkdir -p "$out/logs"
          for prof in $(echo "${{ inputs.profiles }}" | tr , ' '); do
            for p in $CMP_PATHS; do
              label=sf${{ inputs.sf }}-$p-$prof
              echo "::group::$label"
              opts=; [ "$prof" = default ] || opts="-DresourceProfile=$prof"
              ci/m4/stack.sh stop sr flight1
              # a fresh Flight server per run, the server's own default settings (+ the profile)
              M4_SERVER_DEFAULTS=1 M4_FLIGHT_MEM=6g FLIGHT_JAVA_OPTS="$opts" ci/m4/stack.sh flight "$WORK/m4-assets" flight1
              case $p in
              ours) SR_VARIANT=ours SR_BE_MEM=5G ci/m4/stack.sh starrocks /home/runner/sr-fe-out /home/runner/sr-out ;;
              up)   SR_VARIANT=up SR_BE_MEM=5G ci/m4/stack.sh starrocks /home/runner/up-fe-out /home/runner/up-be-out ;;
              jdbc) SR_VARIANT=jdbc SR_BE_MEM=5G ci/m4/stack.sh starrocks /home/runner/up-fe-out ;;
              esac || { echo "::warning::$label: StarRocks did not start"; ci/m4/stack.sh logs "$out/logs/$label" || true; echo "::endgroup::"; continue; }
              python3 ci/m4/compare.py run --path "$p" --label "$label" --ref "$RUNNER_TEMP/ref.json" --out "$out" \
                --runs "${{ inputs.runs }}" --timeout "${{ inputs.timeout }}" || echo "::warning::$label: harness error"
              ci/m4/stack.sh logs "$out/logs/$label" || true
              docker stats --no-stream || true
              echo "::endgroup::"
            done
          done
          ci/m4/stack.sh stop sr flight1
      - name: Report
        if: always()
        run: |
          out=$RUNNER_TEMP/cmp; mkdir -p "$out"
          {
            echo "# Connector comparison run $GITHUB_RUN_ID (SF${{ inputs.sf }}, server ${{ inputs.server }})"
            echo
            echo "Paths with outputs:${CMP_PATHS:-}; profiles ${{ inputs.profiles }}; ${{ inputs.runs }} runs per query; runner $(nproc) vCPU ($(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')), $(free -g | awk '/Mem/ {print $2}') GB"
            echo
            ls "$out"/*.json >/dev/null 2>&1 && python3 ci/m4/compare.py report --out "$out/report.md" "$out"/*.json >/dev/null && cat "$out/report.md"
            echo
            cat /home/runner/up-fe-out/up-fe-build-info.txt /home/runner/up-be-out/be-build-info.txt 2>/dev/null | grep -E '^(upstream|afs|run)=' | sed 's/^/- up: /' || true
            grep -E '^(commit_hash|run)=' /home/runner/sr-fe-out/fe-build-info.txt /home/runner/sr-out/be-build-info.txt 2>/dev/null | sed 's/^/- ours: /' || true
          } > "$out/results.md"
          cat "$out/results.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compare-${{ github.run_id }}
          path: ${{ runner.temp }}/cmp
          retention-days: 14
      - name: Publish results to branch m4-results
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/cmp/results.md" ] || exit 0
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          d=$RUNNER_TEMP/m4r
          git clone -q --depth 20 -b m4-results "$url" "$d"
          mkdir -p "$d/compare"
          cp "$RUNNER_TEMP/cmp/results.md" "$d/compare/$GITHUB_RUN_ID.md"
          for f in "$RUNNER_TEMP"/cmp/sf*.json; do [ -e "$f" ] || continue; b=$(basename "$f" .json); cp "$f" "$d/compare/$b-$GITHUB_RUN_ID.json"; done
          cd "$d"; git add -A
          git -c user.name=m4 -c user.email=m4@localhost commit -q -m "compare run $GITHUB_RUN_ID (sf ${{ inputs.sf }})"
          git push -q "$url" m4-results
